spring.application.name=autoloc-api
server.port=8081

# ===================== Connexion a la base MySQL =====================
# La base autoloc_db est creee automatiquement si elle n'existe pas.
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
# Mot de passe lu depuis la variable d'environnement DB_PASSWORD.
# Sans variable : valeur apres les ":" (vide = XAMPP/WAMP par defaut).
# Exemple si votre mot de passe est "root" : ${DB_PASSWORD:root}
spring.datasource.password=${DB_PASSWORD:}

# ===================== Hibernate / JPA =====================
# Atelier 2 : mettre "create" pour supprimer et recreer les tables,
# lancer une fois, puis remettre "update" (valeur finale ci-dessous).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================== Swagger / OpenAPI (Atelier 4) =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ===================== Logs =====================
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
